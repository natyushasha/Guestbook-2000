<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guestbook 2000</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="window">

  <div class="titlebar">
    Guestbook 2000
  </div>

  <div class="content">

    <!-- LEFT: messages -->
    <div class="panel">
      <h3>Guestbook</h3>

      <div id="messages"></div>

      <input id="name" placeholder="Your name (optional)">
      <textarea id="text" placeholder="Write your letter..."></textarea>
      <button onclick="postMessage()">Post Letter</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
